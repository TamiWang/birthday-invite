<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>LUCA's Birthday Invite</title>
        <style>
            body {
                background-color: darkseagreen;
                text-align: center;
            }

            h1 {
                text-align: center;
            }

            div>img {
                position: relative;
            }

            #celebrate {
                color: black;
                text-align: center;
            }

            #date {
                color: gold;
            }

            #bring {
                color: aqua;
            }

            li {
                color: darkslategray;
                font-style: italic;
            }

            #navigate {
                color:blue
            }

            a {
                display: block;
                font-size: large;

            }


        </style>
    </head>

    <body>
        <div class="invite">
            <img src="./asserts/images/splatball-logo-square.png" width="20%" alt="splatball-logo">
            <h1 >You are invited! </h1>
            <h2 id="celebrate">to celebrate LUCA's 10th Birthday!</h2>
            <h2 id="date">On the 17th November</h2>
        </div>

        <div class="instructions">

        <img src="./asserts/images/group-oakleigh-splatball.jpg.png" width="30%" alt="splatball-logo-square">
        <h3 id="bring">What to bring:</h3>
        <ul>
            <li>Baloons (I love baloons)</li>
            <li>Cake (I'm really good at eating)</li>
            <li>An appetite (There will be lots of food)</li>
        </ul>
    </div>
        <h3 id="navigate">This is where you need to go:</h3>
        <img src="./asserts/images/splatball-title.png" width="15%" alt="splatball-title">
        <a href="https://www.google.com/maps/@35.7040744,139.5577317,3a,75y,289.6h,87.01t,0.72r/data=!3m6!1e1!3m4!1sgT28ssf0BB2LxZ63JNcL1w!2e0!7i13312!8i6656">Google map link</a>
    </body>
</html>
